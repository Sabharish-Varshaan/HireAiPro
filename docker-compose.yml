services:
  postgres:
    image: postgres:16
    container_name: hireai_postgres
    environment:
      POSTGRES_USER: hireai
      POSTGRES_PASSWORD: hireai
      POSTGRES_DB: hireai
    ports:
      - "5435:5432"
    volumes:
      - hireai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireai"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: hireai_valkey
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hireai_qdrant
    mem_limit: 1g   # working set ~300 MB; bounds page cache inside the Docker VM
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - hireai_qdrant_data:/qdrant/storage

  # Judge0 (opt-in): cgroup-v2 build from reviewed, pinned sources (infra/judge0,
  # docs/JUDGE0_CGROUP_V2.md). ~0.5 GB RAM idle. Start: docker compose --profile judge0 up -d
  judge0-db:
    profiles: ["judge0"]
    image: postgres:16
    container_name: hireai_judge0_db
    mem_limit: 512m
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0-local-only}
      POSTGRES_DB: judge0
    volumes:
      - hireai_judge0_pg16:/var/lib/postgresql/data

  judge0-redis:
    profiles: ["judge0"]
    image: redis:7
    container_name: hireai_judge0_redis
    mem_limit: 256m
    command: ["redis-server", "--requirepass", "${JUDGE0_REDIS_PASSWORD:-judge0-local-only}"]

  judge0-server: &judge0
    profiles: ["judge0"]
    build: ./infra/judge0
    image: hireai/judge0-cgv2:1.13.1-pr599
    container_name: hireai_judge0_server
    privileged: true        # required by isolate; isolate is the sandbox boundary
    cgroup: private         # never "host": the entrypoint reorganises /sys/fs/cgroup
    mem_limit: 1536m        # a runaway here must not OOM the whole Docker VM
    pids_limit: 512
    ports:
      - "127.0.0.1:2358:2358"
    environment: &judge0-env
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0-local-only}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0-local-only}
      COUNT: "1"            # resque workers; the 2*nproc default is too heavy for a laptop VM
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "false"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "false"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-workers:
    <<: *judge0
    container_name: hireai_judge0_workers
    ports: []
    command: ["./scripts/workers"]

  celery-worker:
    profiles: ["containerized-worker"]  # local dev runs Celery natively (see docs/LOCAL_SETUP.md)
    build:
      context: ./backend
    container_name: hireai_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - valkey
    volumes:
      - ./backend:/app
      - ./data:/app/data

volumes:
  hireai_pg_data:
  hireai_qdrant_data:
  hireai_judge0_pg:
  hireai_judge0_pg16:
